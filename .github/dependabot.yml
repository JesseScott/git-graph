version: 2
updates:
  - package-ecosystem: npm
    directories: ['/', '/server', '/frontend']
    schedule:
      interval: weekly
    assignees:
      - JesseScott
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # eslint-plugin-react does not yet support ESLint 10 (peer range tops out at ^9.7),
      # so these majors fail `npm ci`. Remove once the plugin supports ESLint 10.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    assignees:
      - JesseScott
